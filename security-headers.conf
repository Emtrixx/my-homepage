# Included into every location that sets its own add_header.
#
# nginx's add_header does NOT merge across levels: a location block with any
# add_header of its own silently discards every add_header inherited from the
# server block. Each location that sets Cache-Control must therefore re-declare
# these, or the site ships with no CSP at all.
#
# This mirrors the old helmet config, minus the 'sha256-Hw3rYwlhx…' hash — the
# inline script it whitelisted lived in register.ejs, which is gone, and Astro
# emits no inline scripts. 'unsafe-eval' stays because both prebuilt WASM
# bundles were compiled with webpack's eval devtool.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-eval'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header X-Frame-Options "SAMEORIGIN" always;
