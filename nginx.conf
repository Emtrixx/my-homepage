server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a reverse proxy, so redirects must stay relative to the public host.
    absolute_redirect off;

    # Astro builds with trailingSlash: 'always'. The mandelbrot WASM bundle
    # (webpack 4, __webpack_require__.p = "") resolves its chunk and .wasm
    # against the *document* URL, so /mandelbrot without the slash would fetch
    # them from the site root and 404. Force the canonical slash on any path
    # that has no file extension.
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # Do NOT add a `types { … }` block here. It replaces the whole MIME map
    # rather than extending it, and /_astro/*.js would go out as
    # application/octet-stream — which, with nosniff, browsers refuse to
    # execute. The base image's mime.types already maps application/wasm.

    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff2;

    # Content-hashed by Astro, safe to pin forever.
    location /_astro/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|avif|webp|woff2|wasm)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML is cheap and must never go stale.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
    }
}
